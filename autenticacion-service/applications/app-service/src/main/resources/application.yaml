server:
  port: 8080

spring:
  application:
    name: autenticacion-service

  security:
    user:
      name: admin
      password: admin

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediYa"
    schema: "public"
    username: "postgres"
    password: "Camilo597"

# JWT Configuration
jwt:
  secret: miClaveSecretaMuySeguraParaJWTQueDebeSerMuyLargaYComplejaParaSeguridad
  expiration: 86400000 # 24 horas en milisegundos

# Logging
logging:
  level:
    co.com.camilo: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.reactive: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"